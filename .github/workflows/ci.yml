name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # the build doesn't talk to the database; these are placeholders so env checks pass
      - run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/ci
          JWT_SECRET: ci-only-secret-not-used-anywhere
